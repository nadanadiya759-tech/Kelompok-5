<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Penerbit - Perpustakaan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

   
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Perpustakaan Digital</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Kembali ke Data</a>
            </div>
        </div>
    </nav>

    
    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Formulir Tambah Data Penerbit & Supplier</h5>
                    </div>
                    <div class="card-body">
                        <form action="index.html" method="GET">
                            
                            <div class="mb-3">
                                <label for="nama_penerbit" class="form-label">Nama Penerbit / Supplier</label>
                                <input type="text" class="form-control" id="nama_penerbit" name="nama_penerbit" placeholder="Masukkan nama penerbit..." required>
                            </div>

                            <div class="mb-3">
                                <label for="wilayah_asal" class="form-label">Wilayah Asal</label>
                                <input type="text" class="form-control" id="wilayah_asal" name="wilayah_asal" placeholder="Contoh: Bandung, Jakarta..." required>
                            </div>

                            <div class="mb-3">
                                <label for="nama_sales" class="form-label">Nama Kontak Sales</label>
                                <input type="text" class="form-control" id="nama_sales" name="nama_sales" placeholder="Nama narahubung...">
                            </div>

                            <div class="mb-3">
                                <label for="telepon_sales" class="form-label">Nomor Telepon / WhatsApp</label>
                                <input type="tel" class="form-control" id="telepon_sales" name="telepon_sales" placeholder="08xxxxxxxxxx">
                            </div>

                            <div class="mb-3">
                                <label for="email_sales" class="form-label">Email Sales</label>
                                <input type="email" class="form-control" id="email_sales" name="email_sales" placeholder="sales@penerbit.com">
                            </div>

                            <div class="mb-3">
                                <label for="alamat" class="form-label">Alamat Lengkap</label>
                                <textarea class="form-control" id="alamat" name="alamat" rows="3" placeholder="Masukkan alamat kantor penerbit..."></textarea>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a href="index.html" class="btn btn-secondary">Batal</a>
                                <button type="submit" class="btn btn-primary">Simpan Data Penerbit</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
