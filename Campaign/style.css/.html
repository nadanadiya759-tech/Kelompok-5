.custom-card {
    padding: 25px;
    margin-top: 30px;
    margin-bottom: 30px;
    border: 2px solid #0d6efd;
    border-radius: 10px;
    background-color: #ffffff;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.custom-title {
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 2px solid #e9ecef;
    color: #0d6efd;
}
