<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Data Katalog Buku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Digital Library</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Daftar Data</a>
                <a class="nav-link active" href="tambah.html">Tambah Data</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="kotak-kustom">
            <h2 class="text-primary fw-bold mb-4 pb-2 border-bottom">Formulir Tambah Buku</h2>

            <form action="" method="POST">
                <div class="mb-3">
                    <label for="judul" class="form-label fw-semibold">Judul Buku</label>
                    <input type="text" class="form-control" id="judul" name="judul" placeholder="Masukkan judul buku" required>
                </div>

                <div class="mb-3">
                    <label for="isbn" class="form-label fw-semibold">ISBN</label>
                    <input type="text" class="form-control" id="isbn" name="isbn" placeholder="Contoh: 978-602-03-0001-1" required>
                </div>

                <div class="mb-3">
                    <label for="pengarang" class="form-label fw-semibold">Pengarang</label>
                    <input type="text" class="form-control" id="pengarang" name="pengarang" placeholder="Masukkan nama pengarang" required>
                </div>

                <div class="mb-3">
                    <label for="tahun" class="form-label fw-semibold">Tahun Terbit</label>
                    <input type="number" class="form-control" id="tahun" name="tahun" placeholder="Contoh: 2024" required>
                </div>

                <div class="mb-4">
                    <label for="kategori" class="form-label fw-semibold">Kategori Literatur</label>
                    <input type="text" class="form-control" id="kategori" name="kategori" placeholder="Contoh: Teknologi, Desain Web, Novel" required>
                </div>

                <div class="pt-2">
                    <button type="submit" class="btn btn-primary px-4 fw-semibold">Simpan Data</button>
                    <a href="index.html" class="btn btn-outline-secondary px-4 ms-2">Batal</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
